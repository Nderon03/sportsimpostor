<div style="margin-top:14px">Impostor hint<br><span class="mu small">${({off:"No hint at all.",subtle:"One vague trait that fits many athletes.",clear:"Two traits that narrow it down."})[c.hs]}</span><div class="row" style="margin-top:8px">${["off","subtle","clear"].map(k=>`<button class="chip ${c.hs===k?"on":""}" data-a="hs" data-k="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join("")}</div></div>${trow("guess","Final Impostor Guess","Caught impostors get one final chance to steal the win")}${trow("chaos","Chaos Round","Hidden group rules, secret personal rules, maximum chaos")}${trow("mole","Mole mode","Impostors get a similar athlete and don't know they're the impostor")}${trow("sound","Sound effects","Made in your browser, no downloads")}</div>
${S.err?`<p class="err">${esc(S.err)}</p>`:""}${btn("go","Start game")}`},

${S.shown===2?V.chaosCard():S.shown?V.role():btn("reveal","I'm "+esc(n)+" &mdash; show my role")}`},
role(){const n=P()[S.ri],isI=S.round.imp.includes(S.ri)&&!S.round.decoy,p=(S.round.imp.includes(S.ri)&&S.round.decoy&&DB.find(x=>x.id===S.round.decoy))||person(),sp=S.round.sport;
return`<div class="card secret ${isI?"imp":""}" role="status" style="--c:${SPORTS[sp].c}"><span class="wm">${ICON[sp]}</span><span class="badge">${isI?"YOU ARE THE":"SECRET PERSON"}</span>${isI?`<div class="big" style="color:var(--bad);margin:14px 0">Impostor</div><p>You don't know who it is. Category: <b>${esc(SPORTS[sp].n)}</b></p><p class="mu small">Listen to the clues, blend in, and work out the secret person.${S.round.imp.length>1?" Don't reveal yourself to the other impostor.":""}</p>${S.round.hint?`<div class="hintbox"><span class="badge">YOUR HINT</span><p style="margin:8px 0 0;font-weight:700">${esc(S.round.hint)}</p></div>`:""}`:`<div class="big" style="margin:14px 0">${esc(p.name)}</div><p>${esc(SPORTS[sp].n)} &middot; ${esc(p.roles[sp])}</p><p class="mu small">${esc(p.nat)}${p.team?" &middot; "+esc(p.team):""}</p>`}</div>
${btn("hide",S.cfg.chaos&&S.round.chaos?"Next: my chaos rule":"Hide &amp; pass the phone")}`},
chaosCard(){const c=S.round.chaos,i=S.ri;return`<div class="card secret chaoscard" role="status"><span class="badge">CHAOS ROUND</span><h3>Your secret rule</h3><div class="rule">${esc(c.per[i])}</div><h3>Hint about the group rule</h3><p style="font-weight:700">${esc(c.hint[i])}</p><p class="mu small">Never show this to anyone. Follow your rule naturally, and notice what everyone else is doing.</p></div>${btn("hide","Got it &mdash; hide my rule")}`},
ready(){const f=P()[S.order[0]];return`${bar()}<div class="card center"><span class="badge">ALL ROLES SEEN</span><h2 style="margin:14px 0">Round started</h2><p>Everyone gives <b>one clue</b> about the secret person. Don't say the name.</p><p class="mu">Starting with</p><div class="big glow">${esc(f)}</div><p class="mu small">Then clockwise around the group.</p>${S.cfg.chaos&&S.round.chaos?'<p class="small"><span class="chaos">CHAOS ROUND</span> Follow your private rule and watch for the group rule.</p>':""}</div>${btn("begin","Start clues")}`},
play(){const o=S.order,n=P(),done=S.ti>=o.length;return`${bar()}<div class="card center"><span class="badge">CLUES</span>${done?`<h2 style="margin:14px 0">Everyone has spoken</h2><p class="mu">Debate who's bluffing, then vote.</p>`:`<p class="mu" style="margin:14px 0 4px">Now speaking</p><div class="big glow">${esc(n[o[S.ti]])}</div><p class="mu small">One clue, then pass.</p>`}</div>
<div class="turn">${o.map((i,k)=>`<span class="${k<S.ti?"d":k===S.ti?"c":""}">${esc(n[i])}</span>`).join("")}</div>
${done?btn("toVote","Go to voting"):btn("nextTurn","Next speaker")+btn("toVote","Skip to voting","alt")}`},
vote(){const n=P(),k=S.round.imp.length,t=S.votes.reduce((a,b)=>a+b,0);return`${bar()}<h2>Voting</h2><p class="mu">Count hands aloud, then enter the totals. ${k>1?`There are <b>${k} impostors</b>: the top ${k} vote-getters are accused and the crew must catch all of them.`:"Most votes is accused."}</p>
<div class="card">${n.map((x,i)=>`<div class="row sp" style="padding:6px 0">${esc(x)}<div class="step"><button data-a="v" data-i="${i}" data-d="-1" aria-label="Remove vote for ${esc(x)}">&minus;</button><b>${S.votes[i]}</b><button data-a="v" data-i="${i}" data-d="1" aria-label="Add vote for ${esc(x)}">+</button></div></div>`).join("")}<p class="mu small" style="margin-bottom:0">${t} vote${t===1?"":"s"} counted. Ties mean the impostor escapes.</p></div>
${S.err?`<p class="err">${esc(S.err)}</p>`:""}${btn("tally","Reveal result")}`},
guess(){const n=P(),r=S.res,g=esc(n[r.guesser]);return`${bar()}<div class="card center shot"><span class="badge">CAUGHT</span><h1 class="shoth">One last shot</h1>
${r.caught.length>1&&r.gs===0?`<p class="mu">Caught: pick who takes the shot.</p><div class="row" style="justify-content:center">${r.caught.map(i=>`<button class="chip ${i===r.guesser?"on":""}" data-a="pick" data-i="${i}">${esc(n[i])}</button>`).join("")}</div>`:""}
<div class="big glow" style="margin:14px 0">${g}</div>
${r.gs===0?`<p>You were caught. Say out loud who you think the secret athlete is.</p><p class="mu small">Everyone else: stay silent and keep the answer to yourselves.</p>`:`<p>Guess locked in.</p><p class="mu small">Crew: you know the real answer. Was ${g} right?</p>`}</div>
${r.gs===0?btn("lockg","Lock in final guess"):btn("gres","Yes, they got it","ok",'data-k="1"')+btn("gres","No, wrong","bad",'data-k="0"')}`},
suspense(){const k=S.round.sport;return`${banner()}<div class="card center susp"><span class="susp-ico">${ICON[k]}</span><h2 style="margin:16px 0 6px">Guess locked</h2><div class="dots"><i></i><i></i><i></i></div></div>${btn("skipS","Skip","alt")}`},
result(){const n=P(),r=S.res,k=S.round.sport,p=person(),cs=S.cs==null?4:S.cs,imps=S.round.imp.map(i=>esc(n[i])),pl=imps.length>1;
const HL={f1:"CHEQUERED FLAG!",football:"FULL-TIME!",ufc:"KNOCKOUT!",wwe:"MAIN EVENT!",basketball:"BUZZER BEATER!"}[k],gname=r.guesser!=null?esc(n[r.guesser]):"";
const W={caught:["THE CREW WINS",pl?"Every impostor was caught.":"The impostor was caught."],failed:["THE CREW WINS","The impostor was caught and failed to steal the win."],stolen:["THE IMPOSTOR STEALS THE WIN",gname+" guessed the secret athlete correctly."],escaped:["THE IMPOSTOR ESCAPES",r.tie?"The vote was tied or empty.":"The vote didn't catch every impostor."]}[r.how];
const a=x=>cs===x?" pop":"";
return`${banner()}<div class="cine${cs===1?" shake":""}">
${cs===0?`<div class="card center countdown"><div class="cd">${S.cd}</div><p class="mu">The impostor is revealed in...</p></div>`:""}
${cs>=1?`${cs===1?'<div class="fx"></div>':""}<div class="card center stage${a(1)} ${r.winner==="imp"?"imp":""}"><div class="hl">${HL}</div><p class="mu" style="margin:8px 0 0">${pl?"The impostors were":"The impostor was"}</p><div class="impname">${imps.join('<span class="amp"> &amp; </span>')}</div></div>`:""}
${cs===2?vfx(k,r.winner):""}${cs>=2?`<div class="win${a(2)} ${r.winner}"><h2>${W[0]}</h2><p class="mu">${W[1]}</p></div>`:""}
${cs>=3?`<div class="card center ath${a(3)}"><div class="mu small">The secret athlete was...</div><div class="athname">${esc(p.name)}</div><div class="mu small">${esc(p.roles[k])}${p.team?" &middot; "+esc(p.team):""}</div>${S.round.decoy?`<div class="mu small" style="margin-top:6px">The impostor was secretly given ${esc((DB.find(x=>x.id===S.round.decoy)||{name:"someone else"}).name)}.</div>`:""}</div>`:""}
${cs>=4&&S.round.chaos?`<p class="mu small center">Chaos group rule: ${esc(S.round.chaos.shared)}</p>`:""}
</div>${cs>=4?btn("again","Play again")+btn("play","Change settings","alt")+btn("home","Home","alt"):cs>=1?btn("skip","Skip","alt"):""}`},
tests(){const r=runTests();return`<div class="bar"><button data-a="home">&larr; Home</button><span class="mu small">Self-tests</span><span></span></div><div class="card"><b class="${r.fail?"err":""}">${r.pass} passed, ${r.fail} failed</b><ul class="small mu">${r.log.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div>`}
};
function runTests(){const log=[];let pass=0,fail=0;const t=(m,c)=>{c?pass++:(fail++,log.push("FAIL: "+m))};
const ids=DB.map(p=>p.id);t("no duplicate ids",new Set(ids).size===ids.length);
for(const s in SPORTS)t(s+" has 50+ people",DB.filter(p=>p.sports.includes(s)).length>=50);
t("Brock Lesnar in UFC and WWE once",DB.filter(p=>p.name==="Brock Lesnar").length===1&&DB.find(p=>p.name==="Brock Lesnar").sports.length===2);
for(const[n,k]of[[3,1],[6,1],[12,3],[8,2],[10,3]]){for(let it=0;it<300;it++){const r=makeRound(n,k,Object.keys(SPORTS),"random",[]);if(r.imp.length!==k||new Set(r.imp).size!==k||r.imp.some(i=>i<0||i>=n)||!DB.find(p=>p.id===r.pid)){t("roles "+n+"/"+k,false);break}}t("roles ok "+n+"p/"+k+"imp",true)}
let used=[],dup=false;for(let i=0;i<20;i++){const r=makeRound(4,1,["ufc"],"hard",used);if(used.includes(r.pid)&&poolFor(["ufc"],"hard").list.length>used.length)dup=true;used.push(r.pid)}t("no repeat person within a session",!dup);
t("maxImp limits",maxImp(3)===1&&maxImp(12)===3);
let j=judge([0,3,1],[1]);t("caught",j.crewWin&&j.caught[0]===1);
j=judge([2,2,1],[0]);t("tie => escape",j.tie&&!j.crewWin);
j=judge([0,0,0],[0]);t("empty => escape",!j.crewWin);
j=judge([3,3,0,0,0],[0,1]);t("2 imps both caught",j.crewWin);
j=judge([3,1,3,0,0],[0,1]);t("2 imps one caught => escape",!j.crewWin);
j=judge([3,2,2,0,0],[0,1]);t("tie at cutoff => escape",!j.crewWin);
let hb=0;for(const p of DB)for(let i=0;i<5;i++){const h=clueFor(p,p.sports);if(!h||h.toLowerCase().includes(p.name.toLowerCase()))hb++}t("hints exist and never contain the full name",hb===0);
for(const s in SPORTS)for(const L of"EMH")t(s+" tier "+L+" has 12+ people",DB.filter(p=>p.sports.includes(s)&&p.diff===L).length>=12);
{const J=(v,i)=>judge(v,i);const c1=J([0,3,1],[1]),e1=J([2,2,1],[0]),m1=J([3,1,3,0,0],[0,1]),m2=J([3,3,0,0,0],[0,1]);
t("no guess: caught => crew",outcome(c1,false).winner==="crew");t("guess correct => impostor steals",outcome(c1,true,true).how==="stolen");t("guess wrong => crew",outcome(c1,true,false).how==="failed");
t("tie never triggers guess",outcome(e1,true,true).how==="escaped");t("partial catch escapes",outcome(m1,true,true).how==="escaped");t("all impostors caught triggers guess",m2.crewWin&&outcome(m2,true,false).winner==="crew");
for(const sp of Object.keys(SPORTS)){const ch=makeChaos(12,sp);t("chaos 12 unique rules "+sp,new Set(ch.per).size===12&&ch.hint.length===12&&!!ch.shared)}
const ch2=makeChaos(3,"ufc");t("chaos rules for every player",ch2.per.every(Boolean)&&ch2.hint.every(Boolean));
let leak=0;for(let i=0;i<200;i++){const r=makeRound(6,2,Object.keys(SPORTS),"random",[]);const pp=DB.find(x=>x.id===r.pid);const ch=makeChaos(6,pp.sports[0]);if(new RegExp("(^|[^a-z])"+pp.name.toLowerCase().replace(/[^a-z0-9 ]/g,".")+"([^a-z]|$)").test(JSON.stringify(ch).toLowerCase()))leak++}t("chaos rules never contain the athlete",leak===0)}
{const au=auditChaos();t("chaos audit clean"+(au.length?": "+au.slice(0,3).join("; "):""),au.length===0);
const bad1=checkChaos({shared:SHARED[0].t,per:["Keep a poker face and never laugh.","Give your clue a dramatic title."],hint:[SHARED[0].c[0],SHARED[0].c[0]]},2,"ufc");t("checker catches a rule conflict",bad1.some(x=>x.startsWith("conflict")));
t("checker catches duplicates",checkChaos({shared:SHARED[1].t,per:[IND[2],IND[2]],hint:[SHARED[1].c[0],SHARED[1].c[0]]},2,"ufc").some(x=>x.includes("duplicate")));
t("checker catches wrong-sport rule",checkChaos({shared:SHARED[1].t,per:[INDS.football[0],IND[2]],hint:[SHARED[1].c[0],SHARED[1].c[0]]},2,"ufc").some(x=>x.startsWith("wrong sport")));
let cf=0;for(let i=0;i<300;i++){const si=SHARED.findIndex(x=>x.t==="Everyone must use an exaggerated reaction at least once.");const ch=makeChaos(12,"wwe");if(ch.shared===SHARED[si].t&&ch.per.includes("Keep a poker face and never laugh."))cf++}t("poker face never paired with exaggerated-reaction rule",cf===0);
{let dd=0;for(let i=0;i<300;i++){const sp=Object.keys(SPORTS)[i%Object.keys(SPORTS).length],pool=DB.filter(x=>x.sports.includes(sp)),pp=pool[rnd(pool.length)],id=decoyFor(pp,sp),d=DB.find(x=>x.id===id);if(!d||d.id===pp.id||!d.sports.includes(sp))dd++}t("mole decoy is a different athlete from the same sport",dd===0)}
for(const k of Object.keys(SPORTS))for(const w of["crew","imp"])t("win animation "+k+"/"+w,/vfx/.test(vfx(k,w))&&vfx(k,w)!==vfx(k,w==="crew"?"imp":"crew"))}
{const all=(ERA.L+"|"+ERA.C).split("|"),miss=all.filter(n=>!DB.some(p=>p.name===n));t("era lists match the database"+(miss.length?": "+miss.slice(0,6).join(", "):""),!miss.length);
for(const s of Object.keys(SPORTS))for(const E of"LMC")t("era "+E+" has 8+ in "+s,DB.filter(p=>p.sports.includes(s)&&p.era===E).length>=8);
let bad=0;for(const e of["legends","modern","current"])for(let i=0;i<60;i++){const sp=[Object.keys(SPORTS)[i%5]],r=makeRound(5,1,sp,"random",[],e),pp=DB.find(x=>x.id===r.pid);if(pp.era!=={legends:"L",modern:"M",current:"C"}[e])bad++}t("era filter only draws from that era",bad===0);
let nf=0,nar=0,jn=0;for(const p of DB)for(const s of p.sports){const F=FACTS(p,s);if(!F.length)nf++;for(const f of F)if(fit(s,f.k)<8)nar++}t("every person has hint facts; none fit fewer than 8 athletes",nf===0&&nar===0);
for(let i=0;i<150;i++){const p=DB[rnd(DB.length)],h=clueFor(p,p.sports,"clear");if(!h||h.toLowerCase().includes(p.name.toLowerCase()))jn++}t("clear hints are valid",jn===0);
const sp0=DB.filter(p=>p.sports.includes("football")),narrow=sp0.filter(p=>clueFor(p,["football"],"subtle")).length;t("subtle hints build for all football people",narrow===sp0.length)}
return{pass,fail,log:log.length?log:["All checks passed."]}}
function modal(){if(!S.confirm)return"";const r=S.confirm==="restart";return`<div class="modal" role="dialog" aria-modal="true"><div class="card"><h2>${r?"Restart round?":"Go home?"}</h2><p class="mu">${r?"A new secret person is picked and everyone sees their role again.":"This ends the current game. You can start a new one from setup."}</p>${btn("yes",r?"Restart round":"Go home")}${btn("no","Cancel","alt")}</div></div>`}
function activeKey(){return S.round&&S.round.sport&&!["home","setup","tests"].includes(S.phase)?S.round.sport:null}
function theme(){if(!document.body)return;const k=activeKey();document.body.dataset.t=k||"";const b=document.getElementById("bg");if(b)b.innerHTML=k?ICON[k]:""}
let LK=null;function render(){const y=window.pageYOffset||0;if(!["result","suspense"].includes(S.phase))clearTM();theme();const p=S.phase;document.getElementById("app").innerHTML=(V[p]||V.home)()+modal();const K=p+(p==="handover"?S.ri+"/"+S.shown:"");if(!S.confirm&&K!==LK)window.scrollTo(0,0);else window.scrollTo(0,y);LK=K}
if(typeof document!=="undefined"&&document.getElementById("app"))render();
</script></body></html>
