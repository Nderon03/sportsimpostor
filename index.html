<title>Sports Impostor</title>
<style>
:root{--bg:#0b0a10;--card:#17141f;--card2:#201b2e;--line:#2e2745;--pu:#a855f7;--pu2:#7c3aed;--tx:#fff;--mu:#b4aecb;--ok:#4ade80;--bad:#fb7185;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 500px at 50% -10%,color-mix(in srgb,var(--pu2) 40%,transparent),transparent),var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:12px 16px 40px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}

const INDS={football:["Describe your clue like a transfer rumour."],basketball:["Call your clue a clutch moment."],ufc:["Announce your clue like a fight introduction."],wwe:["Deliver your clue like a wrestling promo."]};
const SNEED=[["react"],["comm"],["ack"],["interview"],["formal"],[],["conf"],[],[]];
const INO={"Keep a poker face and never laugh.":["react"],"Speak a little quieter than usual, like you're sharing a secret.":["react"],"Hesitate before your clue as if you're about to reveal something huge.":["conf"],"Talk like an expert analyst giving a post-match interview.":["interview"],"Slip a commentator-style phrase into the conversation.":["comm"]};
const clash=(si,r)=>(INO[r]||[]).some(x=>SNEED[si].includes(x));
function checkChaos(ch,n,sport){const bad=[],si=SHARED.findIndex(x=>x.t===ch.shared);if(si<0)bad.push("unknown shared rule");if(!ch.per||ch.per.length!==n||!ch.hint||ch.hint.length!==n)return bad.concat("wrong rule count");if(new Set(ch.per).size!==n)bad.push("duplicate individual rule");
ch.per.forEach((r,i)=>{if(!r){bad.push("empty rule "+i);return}if(!IND.includes(r)&&!Object.values(INDS).some(a=>a.includes(r)))bad.push("unknown rule: "+r);for(const k in INDS)if(k!==sport&&INDS[k].includes(r))bad.push("wrong sport rule: "+r);if(si>=0&&clash(si,r))bad.push("conflict with group rule: "+r);if(si>=0&&!SHARED[si].c.includes(ch.hint[i]))bad.push("bad hint "+i)});return bad}
function makeChaos(n,sport){for(let a=0;a<30;a++){const sh=pick(SHARED),si=SHARED.indexOf(sh),pool=shuffle(IND.concat(INDS[sport]||[]).filter(r=>!clash(si,r)));if(pool.length<n)continue;const ch={shared:sh.t,per:pool.slice(0,n),hint:Array.from({length:n},()=>pick(sh.c))};if(!checkChaos(ch,n,sport).length)return ch}throw new Error("chaos rules unavailable")}
function auditChaos(){const bad=[],names=DB.map(p=>p.name.toLowerCase());
SHARED.forEach((sh,si)=>{if(sh.c.length<2)bad.push("needs 2+ hints: "+sh.t);const q=(sh.t.match(/"([^"]+)"/)||[])[1];sh.c.forEach(h=>{if(h.includes(sh.t))bad.push("hint repeats rule: "+h);if(q&&h.toLowerCase().includes(q.toLowerCase()))bad.push("hint gives away phrase: "+h)});
for(const sp of Object.keys(SPORTS)){const pool=IND.concat(INDS[sp]||[]).filter(r=>!clash(si,r));if(pool.length<12)bad.push("pool too small for "+sp+" / "+sh.t)}});
IND.concat(...Object.values(INDS)).concat(SHARED.map(x=>x.t)).forEach(r=>{if(r.length>110)bad.push("too long: "+r);if(names.some(nm=>nm.length>4&&new RegExp("(^|[^a-z])"+nm.replace(/[^a-z0-9 ]/g,".")+"([^a-z]|$)").test(r.toLowerCase())))bad.push("mentions an athlete: "+r)});
for(const sp of Object.keys(SPORTS))for(let i=0;i<150;i++){const n=3+i%10,ch=makeChaos(n,sp),b=checkChaos(ch,n,sp);if(b.length){bad.push(sp+": "+b[0]);break}}
return bad}
function decoyFor(p,sport){const f=x=>(x||"").split(/[ \/,]/)[0].toLowerCase(),c=DB.filter(x=>x.id!==p.id&&x.sports.includes(sport)).map(x=>({x,sc:(f(x.roles[sport])===f(p.roles[sport])?3:0)+(x.nat===p.nat?2:0)+(x.team&&p.team&&x.team.split(", ").some(t=>p.team.split(", ").includes(t))?2:0)+(x.diff===p.diff?1:0)+Math.random()*1.5})).sort((a,b)=>b.sc-a.sc);return c.length?c[rnd(Math.min(4,c.length))].x.id:null}
